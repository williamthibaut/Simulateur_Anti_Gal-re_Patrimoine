<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Bank RPG - Simulateur Couple & Smart AI Budget Optimizer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 10px; }
        .container { max-width: 1400px; margin: auto; background: #1e293b; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1, h2, h3 { color: #38bdf8; }
        .nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav button { padding: 8px 12px; background: #334155; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .nav button.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
        .nav button.celib-btn { background: #64748b; font-weight: bold; }
        .nav button.celib-btn:hover { background: #475569; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #0f172a; font-size: 12px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #334155; white-space: nowrap; }
        th { background: #334155; }
        
        .form-section-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 15px; transition: opacity 0.3s ease, filter 0.3s ease; }
        .form-section-card.partenaire2-card { border-color: #7f1d1d; background: #18080a; }
        .form-section-card.partenaire2-card .form-section-title { color: #f87171; border-bottom-color: #7f1d1d; }
        
        .form-section-card.disabled-section { opacity: 0.45; }
        .form-section-card.disabled-section input:not([type="checkbox"]), 
        .form-section-card.disabled-section select,
        .form-section-card.disabled-section button:not(.immo-toggle-master-btn) { pointer-events: none; opacity: 0.6; }

        .form-section-title { font-size: 14px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .form-grid-inner { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        
        .form-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 3px; font-weight: bold; }
        .form-section-card.partenaire2-card .form-group label { color: #fca5a5; }
        
        .input-wrapper { display: flex; align-items: center; background: #1e293b; border: 1px solid #475569; border-radius: 4px; overflow: hidden; }
        .partenaire2-card .input-wrapper { background: #2a1215; border-color: #7f1d1d; }
        .input-wrapper input { background: transparent; border: none; color: white; padding: 6px; width: 100%; outline: none; box-sizing: border-box; }
        .reset-btn { background: transparent; border: none; color: #64748b; padding: 0 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .reset-btn:hover { color: #f87171; }
        
        button.action-btn { background: #4f46e5; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; margin-right: 5px; margin-top: 5px; }
        button.action-btn:hover { background: #4338ca; }
        button.action-btn.p2-btn { background: #dc2626; }
        button.action-btn.p2-btn:hover { background: #b91c1c; }

        button.del-btn { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        button.del-btn:hover { background: #dc2626; }
        .card { background: #0f172a; padding: 15px; border-radius: 6px; margin-top: 15px; border: 1px solid #334155; }
        
        .table-layout-container { display: grid; grid-template-columns: 1fr 320px; gap: 15px; align-items: start; margin-top: 10px; }
        @media (max-width: 1100px) {
            .table-layout-container { grid-template-columns: 1fr; }
            .form-grid-inner { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="background:linear-gradient(135deg, #1e293b, #0f172a); border:2px solid #38bdf8; padding:15px; border-radius:8px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; box-shadow:0 0 15px rgba(56,189,248,0.25);">
            <div>
                <h1 id="titre-mode" style="margin:0; font-size:1.3rem; color:#f8fafc; text-transform:uppercase;">Ressources & Dépenses Mensuelles - Mode Couple</h1>
                <span style="font-size:11px; color:#94a3b8;">Gérez vos flux financiers à deux et simulez vos projets d'avenir</span>
            </div>
            <div>
                <button onclick="window.location.href='index.html'" class="celib-btn" style="padding: 8px 14px; background: #475569; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;">👤 Passer en Mode Célibataire</button>
            </div>
        </div>

        <div style="display:flex; justify-content:flex-end; align-items:center; margin-bottom: 15px;">
            <div class="nav" style="margin-bottom:0;">
                <button id="btn-proprietaire" onclick="changerMode('proprietaire')">Ressources & Dépenses</button>
                <button id="btn-projet" onclick="changerMode('projet')">Projet & Patrimoine</button>
                <button id="btn-ia" onclick="changerMode('ia')" style="background:#0284c7; font-weight:bold;">🤖 Smart AI</button>
            </div>
        </div>
        
        <div id="app-content"></div>
    </div>

    <script>
        let modeActuel = 'proprietaire';
        let dernierMessageAlerte = '';
        
        let cfg = {
            salaireBrut: 2950,
            primeAnciennete: 170,
            tauxPas: 5.7,
            salaireNet: 0,
            // Partenaire 2
            salaireBrutP2: 2600,
            primeAncienneteP2: 100,
            tauxPasP2: 4.5,
            salaireNetP2: 0,

            travaux: 0,
            prixAnnonce: 100000,
            prixNetVendeur: 116000,
            fraisNotaireTaux: 7.5,
            taux: 3.6,
            apport: 10000,
            apportP2: 10000,
            taeg: 4.1,
            assuranceTauxAnnuel: 0.34,
            copro: 100,
            taxe: 60,
            loyerActuel: 650,
            internet: 34,
            transport: 29,
            transportP2: 29,
            pea: 100,
            peaP2: 50,
            per: 50,
            perP2: 0,
            bitstack: 52,
            bitstackP2: 0,
            lep: 300,
            lepP2: 0,
            courses: 250,
            loisirs: 100,
            montantProjet: 0,
            objectifResteAVivre: 100,
            optionCibleOptimisation: '20',
            surplusStrategie: 'loisirs', 
            dateDebutProjet: '2027-08',
            possedeImmo: true,
            depenseFuturNom: 'Vacances futur',
            depenseFuturMontant: 0,
            depenseFuturCompteCible: 'LEP (Matelas Sécurité)'
        };

        let abonnementsVie = [
            { nom: 'World of Warcraft', montant: 11.99 },
            { nom: 'Salle de sport', montant: 30.00 }
        ];

        let abonnementsVieP2 = [
            { nom: 'Netflix Partenaire 2', montant: 13.49 }
        ];

        let comptesDispo = [
            { nom: 'Compte Courant Boursorama', solde: 200, rendement: 0, versementMensuel: 0, virementExterne: 0 },
            { nom: 'Livret A', solde: 1, rendement: 1.7, versementMensuel: 0, virementExterne: 0 },
            { nom: 'LEP (Matelas Sécurité)', solde: 1550, rendement: 2.5, versementMensuel: 100, virementExterne: 0 }
        ];

        let comptesDispoP2 = [
            { nom: 'Compte Courant Partenaire 2', solde: 500, rendement: 0, versementMensuel: 0, virementExterne: 0 },
            { nom: 'Livret A Partenaire 2', solde: 2000, rendement: 1.7, versementMensuel: 50, virementExterne: 0 }
        ];

        let placementsBloques = [
            { nom: 'PEA (Actions Mondiales / ETF)', solde: 2150, rendement: 7.5, versementMensuel: 100, virementExterne: 0 },
            { nom: 'PER (Plan Épargne Retraite)', solde: 1700, rendement: 5.0, versementMensuel: 50, virementExterne: 0 },
            { nom: 'Bitstack / Bitcoin', solde: 595, rendement: 10.0, versementMensuel: 20, virementExterne: 0 },
            { nom: 'PEL (Plan Épargne Logement)', solde: 2880, rendement: 1.6, versementMensuel: 0, virementExterne: 50 }
        ];

        let placementsBloquesP2 = [
            { nom: 'PEA Partenaire 2', solde: 1200, rendement: 7.5, versementMensuel: 50, virementExterne: 0 }
        ];

        let patrimoineSupplementaire = [
            { nom: 'Carte / Objets de collection', valeur: 700 },
            { nom: 'Quiver de Kitesurf (Ail harnais barre pompe -2023-2024)', valeur: 1000 }
        ];

        let snapshotDernierEnregistrement = null;

        function faireSnapshotFormulaire() {
            synchroniserDonneesDynamiques();
            snapshotDernierEnregistrement = {
                cfg: JSON.parse(JSON.stringify(cfg)),
                abonnementsVie: JSON.parse(JSON.stringify(abonnementsVie)),
                abonnementsVieP2: JSON.parse(JSON.stringify(abonnementsVieP2)),
                comptesDispo: JSON.parse(JSON.stringify(comptesDispo)),
                comptesDispoP2: JSON.parse(JSON.stringify(comptesDispoP2)),
                placementsBloques: JSON.parse(JSON.stringify(placementsBloques)),
                placementsBloquesP2: JSON.parse(JSON.stringify(placementsBloquesP2)),
                patrimoineSupplementaire: JSON.parse(JSON.stringify(patrimoineSupplementaire))
            };
            dernierMessageAlerte = "💾 Budget couple validé et enregistré comme référence pour le reset !";
        }

        function restaurerDernierEnregistrement() {
            if (!snapshotDernierEnregistrement) {
                dernierMessageAlerte = "⚠️ Aucun enregistrement précédent trouvé. Cliquez d'abord sur 'Mettre à jour le budget'.";
                render();
                return;
            }
            cfg = JSON.parse(JSON.stringify(snapshotDernierEnregistrement.cfg));
            abonnementsVie = JSON.parse(JSON.stringify(snapshotDernierEnregistrement.abonnementsVie));
            abonnementsVieP2 = JSON.parse(JSON.stringify(snapshotDernierEnregistrement.abonnementsVieP2));
            comptesDispo = JSON.parse(JSON.stringify(snapshotDernierEnregistrement.comptesDispo));
            comptesDispoP2 = JSON.parse(JSON.stringify(snapshotDernierEnregistrement.comptesDispoP2));
            placementsBloques = JSON.parse(JSON.stringify(snapshotDernierEnregistrement.placementsBloques));
            placementsBloquesP2 = JSON.parse(JSON.stringify(snapshotDernierEnregistrement.placementsBloquesP2));
            patrimoineSupplementaire = JSON.parse(JSON.stringify(snapshotDernierEnregistrement.patrimoineSupplementaire));
            dernierMessageAlerte = "↩️ Restauration effectuée : retour aux valeurs du dernier 'Mettre à jour le budget'.";
            render();
        }

        function ajouterLignePatrimoineSupp() {
            synchroniserDonneesDynamiques();
            patrimoineSupplementaire.push({ nom: 'Nouvel Actif', valeur: 0 });
            render();
        }

        function supprimerLignePatrimoineSupp(index) {
            synchroniserDonneesDynamiques();
            patrimoineSupplementaire.splice(index, 1);
            render();
        }

        function calculerPret(capital, tauxAnnuel, dureeAnnees) {
            if (capital <= 0 || tauxAnnuel <= 0) return 0;
            const r = tauxAnnuel / 100 / 12;
            const n = dureeAnnees * 12;
            return (capital * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
        }

        function changerMode(nouveauMode) {
            modeActuel = nouveauMode;
            render();
        }

        function resetField(fieldName) {
            if (cfg.hasOwnProperty(fieldName)) {
                cfg[fieldName] = 0;
            }
            render();
        }

        function ajouterAbonnement(partenaire = 1) {
            if(partenaire === 2) {
                abonnementsVieP2.push({ nom: 'Nouvel Abonnement P2', montant: 10.00 });
            } else {
                abonnementsVie.push({ nom: 'Nouvel Abonnement', montant: 10.00 });
            }
            render();
        }

        function supprimerAbonnement(index, partenaire = 1) {
            if(partenaire === 2) {
                abonnementsVieP2.splice(index, 1);
            } else {
                abonnementsVie.splice(index, 1);
            }
            render();
        }

        function ajouterCompteDispo(partenaire = 1) {
            if(partenaire === 2) {
                comptesDispoP2.push({ nom: 'Nouveau Compte P2', solde: 0, rendement: 0, versementMensuel: 0, virementExterne: 0 });
            } else {
                comptesDispo.push({ nom: 'Nouveau Compte', solde: 0, rendement: 0, versementMensuel: 0, virementExterne: 0 });
            }
            render();
        }

        function supprimerCompteDispo(index, partenaire = 1) {
            if(partenaire === 2) {
                comptesDispoP2.splice(index, 1);
            } else {
                comptesDispo.splice(index, 1);
            }
            render();
        }

        function ajouterPlacementBloque(partenaire = 1) {
            if(partenaire === 2) {
                placementsBloquesP2.push({ nom: 'Nouveau Placement P2', solde: 0, rendement: 5.0, versementMensuel: 0, virementExterne: 0 });
            } else {
                placementsBloques.push({ nom: 'Nouveau Placement', solde: 0, rendement: 5.0, versementMensuel: 0, virementExterne: 0 });
            }
            render();
        }

        function supprimerPlacementBloque(index, partenaire = 1) {
            if(partenaire === 2) {
                placementsBloquesP2.splice(index, 1);
            } else {
                placementsBloques.splice(index, 1);
            }
            render();
        }

        function synchroniserDonneesDynamiques() {
            const rowsAbo = document.querySelectorAll('#table-abos tr.row-abo');
            rowsAbo.forEach((row, i) => {
                if (abonnementsVie[i]) {
                    abonnementsVie[i].nom = row.querySelector('.inp-abo-nom').value;
                    abonnementsVie[i].montant = parseFloat(row.querySelector('.inp-abo-val').value) || 0;
                }
            });

            const rowsAboP2 = document.querySelectorAll('#table-abos-p2 tr.row-abo-p2');
            rowsAboP2.forEach((row, i) => {
                if (abonnementsVieP2[i]) {
                    abonnementsVieP2[i].nom = row.querySelector('.inp-abo-nom').value;
                    abonnementsVieP2[i].montant = parseFloat(row.querySelector('.inp-abo-val').value) || 0;
                }
            });

            const rowsDispo = document.querySelectorAll('#table-dispo tr.row-dispo');
            rowsDispo.forEach((row, i) => {
                if (comptesDispo[i]) {
                    comptesDispo[i].nom = row.querySelector('.inp-nom').value;
                    comptesDispo[i].solde = parseFloat(row.querySelector('.inp-solde').value) || 0;
                    const inpV = row.querySelector('.inp-versement');
                    if (inpV) {
                        comptesDispo[i].versementMensuel = parseFloat(inpV.value) || 0;
                        let nomC = comptesDispo[i].nom.toUpperCase();
                        if(nomC.includes('LEP')) cfg.lep = comptesDispo[i].versementMensuel;
                    }
                    const inpExt = row.querySelector('.inp-virement-externe');
                    if (inpExt) comptesDispo[i].virementExterne = parseFloat(inpExt.value) || 0;
                    comptesDispo[i].rendement = parseFloat(row.querySelector('.inp-rendement').value) || 0;
                }
            });

            const rowsDispoP2 = document.querySelectorAll('#table-dispo-p2 tr.row-dispo-p2');
            rowsDispoP2.forEach((row, i) => {
                if (comptesDispoP2[i]) {
                    comptesDispoP2[i].nom = row.querySelector('.inp-nom').value;
                    comptesDispoP2[i].solde = parseFloat(row.querySelector('.inp-solde').value) || 0;
                    const inpV = row.querySelector('.inp-versement');
                    if (inpV) {
                        comptesDispoP2[i].versementMensuel = parseFloat(inpV.value) || 0;
                        let nomC = comptesDispoP2[i].nom.toUpperCase();
                        if(nomC.includes('LEP')) cfg.lepP2 = comptesDispoP2[i].versementMensuel;
                    }
                    const inpExt = row.querySelector('.inp-virement-externe');
                    if (inpExt) comptesDispoP2[i].virementExterne = parseFloat(inpExt.value) || 0;
                    comptesDispoP2[i].rendement = parseFloat(row.querySelector('.inp-rendement').value) || 0;
                }
            });

            const rowsBloque = document.querySelectorAll('#table-bloque tr.row-bloque');
            rowsBloque.forEach((row, i) => {
                if (placementsBloques[i]) {
                    placementsBloques[i].nom = row.querySelector('.inp-nom').value;
                    placementsBloques[i].solde = parseFloat(row.querySelector('.inp-solde').value) || 0;
                    const inpV = row.querySelector('.inp-versement');
                    if (inpV) {
                        placementsBloques[i].versementMensuel = parseFloat(inpV.value) || 0;
                        let nomP = placementsBloques[i].nom.toUpperCase();
                        if(nomP.includes('PEA')) cfg.pea = placementsBloques[i].versementMensuel;
                        if(nomP.includes('PER')) cfg.per = placementsBloques[i].versementMensuel;
                        if(nomP.includes('BITSTACK') || nomP.includes('BITCOIN')) cfg.bitstack = placementsBloques[i].versementMensuel;
                    }
                    const inpExt = row.querySelector('.inp-virement-externe');
                    if (inpExt) placementsBloques[i].virementExterne = parseFloat(inpExt.value) || 0;
                    placementsBloques[i].rendement = parseFloat(row.querySelector('.inp-rendement').value) || 0;
                }
            });

            const rowsBloqueP2 = document.querySelectorAll('#table-bloque-p2 tr.row-bloque-p2');
            rowsBloqueP2.forEach((row, i) => {
                if (placementsBloquesP2[i]) {
                    placementsBloquesP2[i].nom = row.querySelector('.inp-nom').value;
                    placementsBloquesP2[i].solde = parseFloat(row.querySelector('.inp-solde').value) || 0;
                    const inpV = row.querySelector('.inp-versement');
                    if (inpV) {
                        placementsBloquesP2[i].versementMensuel = parseFloat(inpV.value) || 0;
                        let nomP = placementsBloquesP2[i].nom.toUpperCase();
                        if(nomP.includes('PEA')) cfg.peaP2 = placementsBloquesP2[i].versementMensuel;
                        if(nomP.includes('PER')) cfg.perP2 = placementsBloquesP2[i].versementMensuel;
                        if(nomP.includes('BITSTACK') || nomP.includes('BITCOIN')) cfg.bitstackP2 = placementsBloquesP2[i].versementMensuel;
                    }
                    const inpExt = row.querySelector('.inp-virement-externe');
                    if (inpExt) placementsBloquesP2[i].virementExterne = parseFloat(inpExt.value) || 0;
                    placementsBloquesP2[i].rendement = parseFloat(row.querySelector('.inp-rendement').value) || 0;
                }
            });

            const rowsPatSupp = document.querySelectorAll('#table-patsupp tr.row-patsupp');
            rowsPatSupp.forEach((row, i) => {
                if (patrimoineSupplementaire[i]) {
                    patrimoineSupplementaire[i].nom = row.querySelector('.inp-patsupp-nom').value;
                    patrimoineSupplementaire[i].valeur = parseFloat(row.querySelector('.inp-patsupp-val').value) || 0;
                }
            });

            const inputGoalSide = document.getElementById('inp-side-goal');
            if (inputGoalSide) cfg.objectifResteAVivre = parseFloat(inputGoalSide.value) || 0;

            const selectOptionOpt = document.getElementById('sel-option-optimisation');
            if (selectOptionOpt) cfg.optionCibleOptimisation = selectOptionOpt.value;

            const selectSurplus = document.getElementById('sel-surplus-strategie');
            if (selectSurplus) cfg.surplusStrategie = selectSurplus.value;

            const inpDateProj = document.getElementById('inp-date-projet');
            if (inpDateProj) cfg.dateDebutProjet = inpDateProj.value;

            const inpDepNom = document.getElementById('inp-depense-nom');
            if (inpDepNom) cfg.depenseFuturNom = inpDepNom.value;

            const inpDepMontant = document.getElementById('inp-depense-montant');
            if (inpDepMontant) cfg.depenseFuturMontant = parseFloat(inpDepMontant.value) || 0;

            const selDepCompte = document.getElementById('sel-depense-compte');
            if (selDepCompte) cfg.depenseFuturCompteCible = selDepCompte.value;
        }

        function sauvegarderFormulaire(event) {
            if(event) event.preventDefault();
            synchroniserDonneesDynamiques();

            const inputs = document.querySelectorAll('.form-section-card input');
            inputs.forEach(input => {
                const name = input.name;
                if (cfg.hasOwnProperty(name)) {
                    cfg[name] = parseFloat(input.value) || 0;
                }
            });

            const checkboxImmo = document.getElementById('chk-possede-immo-toggle');
            if (checkboxImmo) {
                cfg.possedeImmo = checkboxImmo.checked;
            }

            const brutTotal = cfg.salaireBrut + cfg.primeAnciennete;
            const netAvantPas = brutTotal * 0.78; 
            cfg.salaireNet = netAvantPas * (1 - (cfg.tauxPas / 100));

            const brutTotalP2 = cfg.salaireBrutP2 + cfg.primeAncienneteP2;
            const netAvantPasP2 = brutTotalP2 * 0.78; 
            cfg.salaireNetP2 = netAvantPasP2 * (1 - (cfg.tauxPasP2 / 100));

            faireSnapshotFormulaire();
            render();
        }

        function toggleImmoCheckbox() {
            const checkboxImmo = document.getElementById('chk-possede-immo-toggle');
            if (checkboxImmo) {
                cfg.possedeImmo = checkboxImmo.checked;
                sauvegarderFormulaire(null);
            }
        }

        function spamOptimization() {
            synchroniserDonneesDynamiques();
            dernierMessageAlerte = '';
            
            const brutTotal = cfg.salaireBrut + cfg.primeAnciennete;
            cfg.salaireNet = (brutTotal * 0.78) * (1 - (cfg.tauxPas / 100));
            const brutTotalP2 = cfg.salaireBrutP2 + cfg.primeAncienneteP2;
            cfg.salaireNetP2 = (brutTotalP2 * 0.78) * (1 - (cfg.tauxPasP2 / 100));

            const salaireNetTotal = cfg.salaireNet + cfg.salaireNetP2;

            const fraisNotaireCalculés = cfg.prixAnnonce * (cfg.fraisNotaireTaux / 100);
            const coutTotalProjet = cfg.prixAnnonce + fraisNotaireCalculés + cfg.travaux;
            // Apport total combiné des deux partenaires
            const apportTotal = cfg.apport + cfg.apportP2;
            const capitalEmprunte = Math.max(0, (cfg.montantProjet > 0 ? cfg.montantProjet : coutTotalProjet) - apportTotal);

            let dureeCible = parseInt(cfg.optionCibleOptimisation) || 20;
            let tauxCible = cfg.taeg;
            if (dureeCible === 10) tauxCible -= 0.5;
            else if (dureeCible === 15) tauxCible -= 0.3;
            else if (dureeCible === 25) tauxCible += 0.2;
            else if (dureeCible === 30) tauxCible += 0.4;

            const mCible = calculerPret(capitalEmprunte, tauxCible, dureeCible);
            const assuranceMensuelle = (capitalEmprunte * (cfg.assuranceTauxAnnuel / 100)) / 12;
            const totalLogCible = (cfg.possedeImmo ? (mCible + assuranceMensuelle + cfg.copro + cfg.taxe) : cfg.loyerActuel) + cfg.internet + cfg.transport + cfg.transportP2;

            const totalInvest = cfg.pea + cfg.per + cfg.bitstack + cfg.lep + cfg.peaP2 + cfg.perP2 + cfg.bitstackP2 + cfg.lepP2;
            let totalAbos1 = abonnementsVie.reduce((acc, a) => acc + a.montant, 0);
            let totalAbos2 = abonnementsVieP2.reduce((acc, a) => acc + a.montant, 0);
            const totalVie = cfg.courses + cfg.loisirs + totalAbos1 + totalAbos2;

            let resteCible = salaireNetTotal - totalLogCible - totalInvest - totalVie;
            let ecart = cfg.objectifResteAVivre - resteCible;

            if (ecart > 0) {
                let sommeInvestTotal = cfg.pea + cfg.per + cfg.peaP2 + cfg.perP2;
                let reductionInvest = Math.min(sommeInvestTotal, ecart);
                if (sommeInvestTotal > 0) {
                    cfg.pea -= reductionInvest * (cfg.pea / sommeInvestTotal);
                    cfg.per -= reductionInvest * (cfg.per / sommeInvestTotal);
                    cfg.peaP2 -= reductionInvest * (cfg.peaP2 / sommeInvestTotal);
                    cfg.perP2 -= reductionInvest * (cfg.perP2 / sommeInvestTotal);
                }
                ecart -= reductionInvest;

                if (ecart > 0 && cfg.loisirs > 0) {
                    let baisse = Math.min(cfg.loisirs, ecart);
                    cfg.loisirs -= baisse;
                    ecart -= baisse;
                }

                if (ecart > 0 && cfg.courses > 200) {
                    let baisse = Math.min(cfg.courses - 200, ecart);
                    cfg.courses -= baisse;
                    ecart -= baisse;
                }

                if (ecart > 0) {
                    dernierMessageAlerte = `⚠️ Déficit résiduel couple (${ecart.toFixed(2)}€) : Budgets minimaux atteints.`;
                } else {
                    dernierMessageAlerte = `🎯 Option ${dureeCible} Ans (Couple) optimisée !`;
                }

            } else if (ecart < 0) {
                let surplus = Math.abs(ecart);
                if (cfg.surplusStrategie === 'loisirs') {
                    cfg.loisirs += surplus;
                    dernierMessageAlerte = `✨ Surplus couple réalloué dans les Loisirs (+${surplus.toFixed(2)}€) !`;
                } else if (cfg.surplusStrategie === 'investissement') {
                    let part = surplus / 4;
                    cfg.pea += part; cfg.per += part; cfg.peaP2 += part; cfg.perP2 += part;
                    dernierMessageAlerte = `✨ Surplus couple réalloué dans les Investissements !`;
                } else {
                    cfg.loisirs += surplus / 2;
                    let partInv = (surplus / 2) / 2;
                    cfg.pea += partInv; cfg.peaP2 += partInv;
                    dernierMessageAlerte = `✨ Surplus couple réparti en 50/50 !`;
                }
            } else {
                dernierMessageAlerte = `✅ L'option ${dureeCible} Ans couple est exactement à l'objectif de ${cfg.objectifResteAVivre}€ !`;
            }

            render();
        }

                    tableDispoHtml += `<tr class="row-dispo"><td><input type="text" value="${c.nom}" class="inp-nom" style="background:#1e293b; border:1px solid #475569; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${c.solde}" class="inp-solde" style="background:#1e293b; border:1px solid #475569; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${c.versementMensuel || 0}" class="inp-versement" style="background:#1e293b; border:1px solid #475569; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${c.virementExterne || 0}" class="inp-virement-externe" style="background:#1e293b; border:1px solid #475569; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${c.rendement}" class="inp-rendement" style="background:#1e293b; border:1px solid #475569; color:white; padding:4px; width:60px;"> %</td><td><button type="button" class="del-btn" onclick="supprimerCompteDispo(${index}, 1)">Supprimer</button></td></tr>`;
                });
                comptesDispoP2.forEach((c, index) => {
                    tableDispoHtml += `<tr class="row-dispo-p2" style="background:#18080a;"><td><input type="text" value="${c.nom}" class="inp-nom" style="background:#2a1215; border:1px solid #7f1d1d; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${c.solde}" class="inp-solde" style="background:#2a1215; border:1px solid #7f1d1d; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${c.versementMensuel || 0}" class="inp-versement" style="background:#2a1215; border:1px solid #7f1d1d; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${c.virementExterne || 0}" class="inp-virement-externe" style="background:#2a1215; border:1px solid #7f1d1d; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${c.rendement}" class="inp-rendement" style="background:#2a1215; border:1px solid #7f1d1d; color:white; padding:4px; width:60px;"> %</td><td><button type="button" class="del-btn" onclick="supprimerCompteDispo(${index}, 2)">Supprimer</button></td></tr>`;
                });

                let tableBloqueHtml = '';
                placementsBloques.forEach((p, index) => {
                    tableBloqueHtml += `<tr class="row-bloque"><td><input type="text" value="${p.nom}" class="inp-nom" style="background:#1e293b; border:1px solid #475569; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${p.solde}" class="inp-solde" style="background:#1e293b; border:1px solid #475569; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${p.versementMensuel}" class="inp-versement" style="background:#1e293b; border:1px solid #475569; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${p.virementExterne || 0}" class="inp-virement-externe" style="background:#1e293b; border:1px solid #475569; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${p.rendement}" class="inp-rendement" style="background:#1e293b; border:1px solid #475569; color:white; padding:4px; width:60px;"> %</td><td><button type="button" class="del-btn" onclick="supprimerPlacementBloque(${index}, 1)">Supprimer</button></td></tr>`;
                });
                placementsBloquesP2.forEach((p, index) => {
                    tableBloqueHtml += `<tr class="row-bloque-p2" style="background:#18080a;"><td><input type="text" value="${p.nom}" class="inp-nom" style="background:#2a1215; border:1px solid #7f1d1d; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${p.solde}" class="inp-solde" style="background:#2a1215; border:1px solid #7f1d1d; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${p.versementMensuel}" class="inp-versement" style="background:#2a1215; border:1px solid #7f1d1d; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${p.virementExterne || 0}" class="inp-virement-externe" style="background:#2a1215; border:1px solid #7f1d1d; color:white; padding:4px; width:100%;"></td><td><input type="number" step="any" value="${p.rendement}" class="inp-rendement" style="background:#2a1215; border:1px solid #7f1d1d; color:white; padding:4px; width:60px;"> %</td><td><button type="button" class="del-btn" onclick="supprimerPlacementBloque(${index}, 2)">Supprimer</button></td></tr>`;
                });

                projetHtml = `
                    <div class="card" style="border: 2px solid #38bdf8; background: linear-gradient(135deg, #0f172a, #1e293b);">
                        <h2 style="margin-top:0; color:#38bdf8; text-transform:uppercase; text-align:center; font-size: 1.2rem;">PATRIMOINE CONJOINT TOTAL (${dateDuJourStr})</h2>
                        <div style="font-size: 28px; font-weight: 900; color: #4ade80; text-align: center; margin: 10px 0;">
                            ${patrimoineTotalInstantT.toFixed(2)} €
                        </div>
                    </div>
                    <div class="card" style="border: 2px solid #4ade80; background: #0f172a;">
                        <h3 style="margin-top:0; color:#4ade80;">🎯 Stratégie d'Atteinte de l'Apport Couple</h3>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; font-size: 13px;">
                            <div style="background:#1e293b; padding:12px; border-radius:6px;">Objectif Apport Total (P1+P2) : <br><b style="color:#38bdf8; font-size:1.2em;">${objectifApport.toFixed(2)} €</b></div>
                            <div style="background:#1e293b; padding:12px; border-radius:6px;">Épargne Disponible Couple : <br><b style="color:#4ade80; font-size:1.2em;">${epargneDispoActuelle.toFixed(2)} €</b></div>
                            <div style="background:#1e293b; padding:12px; border-radius:6px;">Capacité d'épargne conjointe : <br><b style="color:#38bdf8; font-size:1.2em;">${capaciteEpargneActuelleCouple.toFixed(2)} € / mois</b></div>
                        </div>
                    </div>
                    <div class="card" style="border: 2px solid #38bdf8; background: #0f172a; padding: 20px;">
                        <h3 style="color: #38bdf8;">📊 Comptes & Placements (P1 & P2)</h3>
                        <div style="margin-bottom: 25px;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                                <span style="color:#f8fafc; font-weight:bold;">Comptes Disponibles (P1 & P2)</span>
                                <div>
                                    <button type="button" class="action-btn" onclick="ajouterCompteDispo(1)" style="font-size:11px;">+ P1</button>
                                    <button type="button" class="action-btn p2-btn" onclick="ajouterCompteDispo(2)" style="font-size:11px;">+ P2</button>
                                </div>
                            </div>
                            <table><tr><th>Nom</th><th>Solde (€)</th><th>Vers. (€/m)</th><th>Ext. (€/m)</th><th>Rend. (%)</th><th>Action</th></tr>${tableDispoHtml}</table>
                        </div>
                        <div style="margin-bottom: 25px;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                                <span style="color:#f8fafc; font-weight:bold;">Placements Bloqués (P1 & P2)</span>
                                <div>
                                    <button type="button" class="action-btn" onclick="ajouterPlacementBloque(1)" style="font-size:11px;">+ P1</button>
                                    <button type="button" class="action-btn p2-btn" onclick="ajouterPlacementBloque(2)" style="font-size:11px;">+ P2</button>
                                </div>
                            </div>
                            <table><tr><th>Nom</th><th>Solde (€)</th><th>Vers. (€/m)</th><th>Ext. (€/m)</th><th>Rend. (%)</th><th>Action</th></tr>${tableBloqueHtml}</table>
                        </div>
                        ${blocksProjetHtml}
                    </div>`;
            }

            let abosHtml = '';
            abonnementsVie.forEach(abo => {
                abosHtml += `<tr><td>${abo.nom} (P1)</td><td>-${abo.montant.toFixed(2)} €</td><td>-${abo.montant.toFixed(2)} €</td><td>-${abo.montant.toFixed(2)} €</td><td>-${abo.montant.toFixed(2)} €</td><td>-${abo.montant.toFixed(2)} €</td></tr>`;
            });
            abonnementsVieP2.forEach(abo => {
                abosHtml += `<tr><td>${abo.nom} (P2)</td><td>-${abo.montant.toFixed(2)} €</td><td>-${abo.montant.toFixed(2)} €</td><td>-${abo.montant.toFixed(2)} €</td><td>-${abo.montant.toFixed(2)} €</td><td>-${abo.montant.toFixed(2)} €</td></tr>`;
            });

            const getResteStyle = (val) => {
                let isOk = val >= 0;
                let bg = isOk ? 'rgba(74, 222, 128, 0.15)' : 'rgba(239, 68, 68, 0.15)';
                let color = isOk ? '#4ade80' : '#ef4444';
                return `background:${bg}; color:${color}; font-size:1.1em; font-weight:900; border: 2px solid ${color};`;
            };

            let tableauFluxHtml = `
                <div class="table-layout-container">
                    <div>
                        <table>
                            <thead>
                                <tr style="background:#334155; text-align:left;">
                                    <th>Flux Financiers Couple</th>
                                    <th>Option 10 Ans</th>
                                    <th>Option 15 Ans</th>
                                    <th>Option 20 Ans</th>
                                    <th>Option 25 Ans</th>
                                    <th>Option 30 Ans</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td><b>SALAIRE NET P1</b></td><td colspan="5" style="color:#4ade80">+${cfg.salaireNet.toFixed(2)} €</td></tr>
                                <tr><td><b>SALAIRE NET P2</b></td><td colspan="5" style="color:#f87171">+${cfg.salaireNetP2.toFixed(2)} €</td></tr>
                                <tr style="background:#1e293b;"><td colspan="6"><b>1. LOGEMENT & CHARGES FIXES</b></td></tr>
                                <tr><td>Crédit Immobilier</td><td>-${m10.toFixed(2)} €</td><td>-${m15.toFixed(2)} €</td><td>-${m20.toFixed(2)} €</td><td>-${m25.toFixed(2)} €</td><td>-${m30.toFixed(2)} €</td></tr>
                                <tr><td>Assurance Emprunteur</td><td>-${assuranceMensuelle.toFixed(2)} €</td><td>-${assuranceMensuelle.toFixed(2)} €</td><td>-${assuranceMensuelle.toFixed(2)} €</td><td>-${assuranceMensuelle.toFixed(2)} €</td><td>-${assuranceMensuelle.toFixed(2)} €</td></tr>
                                <tr><td>Charges de Copropriété</td><td>-${cfg.copro.toFixed(2)} €</td><td>-${cfg.copro.toFixed(2)} €</td><td>-${cfg.copro.toFixed(2)} €</td><td>-${cfg.copro.toFixed(2)} €</td><td>-${cfg.copro.toFixed(2)} €</td></tr>
                                <tr><td>Taxe Foncière</td><td>-${cfg.taxe.toFixed(2)} €</td><td>-${cfg.taxe.toFixed(2)} €</td><td>-${cfg.taxe.toFixed(2)} €</td><td>-${cfg.taxe.toFixed(2)} €</td><td>-${cfg.taxe.toFixed(2)} €</td></tr>
                                <tr><td>Abonnement Internet</td><td>-${cfg.internet.toFixed(2)} €</td><td>-${cfg.internet.toFixed(2)} €</td><td>-${cfg.internet.toFixed(2)} €</td><td>-${cfg.internet.toFixed(2)} €</td><td>-${cfg.internet.toFixed(2)} €</td></tr>
                                <tr><td>Transport Total (P1 + P2)</td><td>-${transportTotal.toFixed(2)} €</td><td>-${transportTotal.toFixed(2)} €</td><td>-${transportTotal.toFixed(2)} €</td><td>-${transportTotal.toFixed(2)} €</td><td>-${transportTotal.toFixed(2)} €</td></tr>
                                
                                <tr style="background:#1e293b;"><td colspan="6"><b>2. INVESTISSEMENTS (P1 & P2)</b></td></tr>
                                <tr><td>PEA (P1 + P2)</td><td colspan="5">-${(cfg.pea + cfg.peaP2).toFixed(2)} €</td></tr>
                                <tr><td>PER (P1 + P2)</td><td colspan="5">-${(cfg.per + cfg.perP2).toFixed(2)} €</td></tr>
                                <tr><td>Bitstack (P1 + P2)</td><td colspan="5">-${(cfg.bitstack + cfg.bitstackP2).toFixed(2)} €</td></tr>
                                <tr><td>LEP (P1 + P2)</td><td colspan="5">-${(cfg.lep + cfg.lepP2).toFixed(2)} €</td></tr>

                                <tr style="background:#1e293b;"><td colspan="6"><b>3. VIE QUOTIDIENNE</b></td></tr>
                                <tr><td>Courses / Alimentation</td><td colspan="5">-${cfg.courses.toFixed(2)} €</td></tr>
                                <tr><td>Loisirs / Sorties</td><td colspan="5">-${cfg.loisirs.toFixed(2)} €</td></tr>
                                ${abosHtml}

                                <tr style="border-top:3px solid #38bdf8;">
                                    <td style="font-weight:bold; font-size:1.05em;">SOLDE RESTE À VIVRE NET CONJOINT</td>
                                    <td style="${getResteStyle(reste10)}">${reste10>=0?'+':''}${reste10.toFixed(2)} €</td>
                                    <td style="${getResteStyle(reste15)}">${reste15>=0?'+':''}${reste15.toFixed(2)} €</td>
                                    <td style="${getResteStyle(reste20)}">${reste20>=0?'+':''}${reste20.toFixed(2)} €</td>
                                    <td style="${getResteStyle(reste25)}">${reste25>=0?'+':''}${reste25.toFixed(2)} €</td>
                                    <td style="${getResteStyle(reste30)}">${reste30>=0?'+':''}${reste30.toFixed(2)} €</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div style="background: linear-gradient(135deg, #450a0a, #7f1d1d); border: 3px solid #ef4444; border-radius: 10px; padding: 15px; text-align: center;">
                        <div style="font-weight: 900; color: #fca5a5; font-size: 14px; text-transform: uppercase; margin-bottom: 8px;">
                            🎯 OPTIMISEUR COUPLE
                        </div>
                        <button type="button" onclick="spamOptimization()" style="background: #ef4444; color: white; border: none; width: 100%; padding: 14px 10px; border-radius: 6px; font-size: 14px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-bottom: 8px;">
                            🔥 SPAM OPTIMIZE COUPLE 🔥
                        </button>
                        <button type="button" onclick="restaurerDernierEnregistrement()" style="background: #334155; color: #f8fafc; border: 1px solid #94a3b8; width: 100%; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;">
                            🔄 Reset couple
                        </button>
                    </div>
                </div>
            `;

            if (modeActuel === 'proprietaire') {
                content.innerHTML = formHtml + tableauFluxHtml;
            } else if (modeActuel === 'projet') {
                content.innerHTML = projetHtml;
            } else if (modeActuel === 'ia') {
                content.innerHTML = sectionIAHtml + tableauFluxHtml;
            }
        }

        faireSnapshotFormulaire();
        render();
    </script>
</body>
</html>
